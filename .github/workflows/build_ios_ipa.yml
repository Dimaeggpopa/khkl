name: Build iPhone iOS IPA (MyGarageIOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS .ipa on macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare iOS Project (Unzip or Auto-Extract)
        run: |
          if [ ! -f "ios/project.yml" ]; then
            echo "Checking for uploaded .zip archives in repository root..."
            for z in *.zip; do
              if [ -f "$z" ]; then
                echo "Unpacking $z..."
                unzip -o -q "$z" -d . || true
              fi
            done
          fi
          if [ ! -f "ios/project.yml" ]; then
            echo "Extracting built-in iOS SwiftUI project..."
            echo "" | base64 --decode | tar -xzf -
          fi
          ls -la ios/

      - name: Install XcodeGen & Build MyGarageIOS.ipa
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload MyGarageIOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGarageIOS-iPhone-IPA
          path: ios/build/MyGarageIOS.ipa
