name: Build iPhone iOS IPA (MyGarageIOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS .ipa on macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare iOS Project (Extract Latest iOS Sources)
        run: |
          rm -rf ios
          echo "Extracting latest iOS SwiftUI project (Xcode 15/16 compatible)..."
          echo "" | base64 --decode | tar -xzf -
          ls -la ios/

      - name: Install XcodeGen & Build MyGarageIOS.ipa
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload MyGarageIOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGarageIOS-iPhone-IPA
          path: ios/build/MyGarageIOS.ipa
